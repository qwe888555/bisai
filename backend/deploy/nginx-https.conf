# 生产用 Nginx 配置（HTTPS 终止）
# 启用方式：把 docker-compose.yml 里 nginx 的挂载改为本文件，并挂载证书目录
#   - ./deploy/nginx-https.conf:/etc/nginx/conf.d/default.conf:ro
#   - ./deploy/certs:/etc/nginx/certs:ro
# 证书放到 backend/deploy/certs/：fullchain.pem + privkey.pem（不进仓库）

upstream django {
    server web:8000;
}

# HTTP 全部跳 HTTPS
server {
    listen 80;
    server_name example.com;   # 换成真实域名
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name example.com;   # 换成真实域名

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    # 未成年人信息场景，禁止搜索引擎与外部嵌入
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer" always;

    location /static/ {
        alias /app/staticfiles/;
        expires 7d;
    }

    location /api/v1/ {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_redirect off;
        client_max_body_size 60M;
        client_body_timeout 120s;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        client_max_body_size 60M;
    }
}
