# Nginx 反向代理示例（配合 docker-compose.yml；生产按实际域名与证书调整）
# 主要作用：HTTPS 终止、把 /api/v1 转发给后端、限制上传体积

upstream django {
    server web:8000;   # docker-compose.yml 里的服务名
}

server {
    listen 80;
    server_name example.com;   # 换成真实域名；上线务必配 HTTPS

    # 文档页静态资源
    location /static/ {
        alias /app/staticfiles/;
        expires 7d;
    }

    location /api/v1/ {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # requestId 由后端生成，前端如自带请透传
        proxy_set_header X-Request-Id $request_id;
        proxy_redirect off;
        # 批量上传总上限 50MB（MAX_BATCH_TOTAL_MB），留出余量
        client_max_body_size 60M;
        client_body_timeout 120s;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        client_max_body_size 60M;
    }
}
